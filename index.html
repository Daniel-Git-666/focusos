<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="FocusOS" />
  <title>FocusOS · 学习与生活个人看板</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./styles.css?v=20261125c" />
</head>
<body>
  <!-- Floating Translucent macOS Navigation Dock -->
  <div class="nav-dock-wrap">
    <header class="nav-dock">
      <div class="dock-brand">
        <div class="dock-logo">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        </div>
        <span class="dock-title">FocusOS</span>
        <button class="dock-save-pill" id="openSettingsBtn" title="数据备份、Apple Health 导入与设置">
          <span class="status-dot" id="saveStatusDot"></span>
          <span id="saveStatusText">已保存</span>
        </button>
      </div>

      <nav class="dock-tabs" id="mainNav">
        <button class="dock-tab active" data-view="overview">今日</button>
        <button class="dock-tab" data-view="study_space">学习与考公 <span class="dock-tab-count" id="badge-study-space">0</span></button>
        <button class="dock-tab" data-view="life_space">生活与健康 <span class="dock-tab-count" id="badge-meds">0/6</span></button>
        <button class="dock-tab" data-view="kanban">看板 <span class="dock-tab-count" id="badge-all">0</span></button>
        <button class="dock-tab" data-view="notes">便签 <span class="dock-tab-count" id="badge-notes">0</span></button>
      </nav>

      <div class="dock-right">
        <div class="search-trigger">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="search" id="globalSearch" name="focusos_search_q" autocomplete="off" placeholder="搜索 ⌘K" />
        </div>
        <button class="btn-obsidian" id="newTaskBtn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          新建
        </button>
      </div>
    </header>
  </div>

  <!-- Editorial Canvas -->
  <main class="page-canvas">
    <div class="protocol-banner" id="protocolBanner">
      <span>提示：推荐右键运行文件夹中的 <strong>start_mac.command</strong> 以本地服务模式打开，确保浏览器长期持久化最稳妥。</span>
      <button class="btn-subtle" onclick="document.getElementById('protocolBanner').classList.remove('show')">知道了</button>
    </div>

    <div id="viewRoot"></div>
  </main>

  <!-- Task Modal -->
  <div class="modal-backdrop" id="taskModal">
    <div class="modal">
      <div class="modal-head">
        <h3 id="taskModalTitle">新建任务</h3>
        <button class="icon-btn" onclick="closeModal('taskModal')">✕</button>
      </div>
      <form id="taskForm">
        <input type="hidden" id="tf-id" />
        <div class="form-group">
          <label>任务标题 *</label>
          <input type="text" class="form-control" id="tf-title" placeholder="例如：复习 EViews 6.0 回归与检验操作" required />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>所属领域</label>
            <select class="form-control" id="tf-domain">
              <option value="study">学业 / 课程与考试</option>
              <option value="research">科研 / 毕业论文</option>
              <option value="kaogong">28 考公筹备</option>
              <option value="fitness">减脂与运动习惯</option>
              <option value="reading">阅读与兴趣</option>
            </select>
          </div>
          <div class="form-group">
            <label>当前状态</label>
            <select class="form-control" id="tf-status">
              <option value="todo">待开始</option>
              <option value="in_progress">进行中</option>
              <option value="review">待确认 / 导师反馈</option>
              <option value="done">已完成</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>截止日期 (Deadline)</label>
            <input type="date" class="form-control" id="tf-deadline" />
          </div>
          <div class="form-group">
            <label>优先级</label>
            <select class="form-control" id="tf-priority">
              <option value="high">高优先级</option>
              <option value="medium" selected>中优先级</option>
              <option value="low">低优先级</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
            <input type="checkbox" id="tf-today" style="width:15px;height:15px;accent-color:#18181B;" />
            <span>放入「今日聚焦」列表</span>
          </label>
        </div>
        <div class="form-group">
          <label>备注与推进步骤</label>
          <textarea class="form-control" id="tf-desc" rows="3" placeholder="记录细节、课件章节或导师修改意见..."></textarea>
        </div>
        <div class="modal-foot">
          <button type="button" class="btn-subtle" id="tf-deleteBtn" style="color:var(--coral);display:none;">删除任务</button>
          <div style="display:flex;gap:8px;margin-left:auto;">
            <button type="button" class="btn-subtle" onclick="closeModal('taskModal')">取消</button>
            <button type="submit" class="btn-obsidian">保存</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal-backdrop" id="settingsModal">
    <div class="modal" style="max-width:540px;">
      <div class="modal-head">
        <h3>数据防丢与 Apple Watch 导入</h3>
        <button class="icon-btn" onclick="closeModal('settingsModal')">✕</button>
      </div>
      <div class="form-group">
        <label>本地双层持久化状态</label>
        <div style="background:var(--surface-muted);padding:12px 14px;border-radius:var(--r-md);font-size:12.5px;color:var(--ink-secondary);border:1px solid var(--hairline);">
          <div>主存储：<strong>IndexedDB (LifeStudyHubDB v2)</strong> + <strong>localStorage 同步镜像</strong></div>
          <div style="margin-top:4px;" id="storageStatsText">加载中...</div>
        </div>
      </div>
      <div class="form-group">
        <label>JSON 备份与合并导入</label>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn-subtle" id="modalExportBtn">导出 JSON 备份</button>
          <label class="btn-subtle" style="cursor:pointer;">
            合并导入 JSON（不覆盖旧数据）
            <input type="file" id="mergeImportFileInput" accept=".json" style="display:none;" />
          </label>
          <label class="btn-subtle" style="cursor:pointer;">
            覆盖恢复备份
            <input type="file" id="importFileInput" accept=".json" style="display:none;" />
          </label>
          <button class="btn-subtle" id="resetDemoBtn">重置初始数据</button>
        </div>
      </div>
      <div class="form-group" style="margin-top:16px;padding-top:14px;border-top:1px solid var(--hairline);">
        <label>永久云端同步（MacBook / iPad Pro / iPhone 免登录）</label>
        <div id="cloudAuthStatus" style="font-size:12px;color:var(--ink-secondary);margin-bottom:10px;">设置一个专属同步口令（至少 8 位），三端一次绑定永久免登录</div>
        <div class="form-group">
          <label>你的专属同步口令（至少 8 位字母或数字）</label>
          <div style="display:flex;gap:6px;">
            <input type="text" class="form-control" id="sync-key-input" autocomplete="off" placeholder="例如：daniel-focus-2026" />
            <button type="button" class="btn-subtle" id="genSyncKeyBtn" style="white-space:nowrap;">随机生成</button>
          </div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
          <button type="button" class="btn-obsidian" id="saveSyncKeyBtn">保存并开启永久同步</button>
        </div>
        <div id="cloudConnectedActions" style="display:none;gap:8px;flex-wrap:wrap;">
          <button type="button" class="btn-subtle" id="copyMagicLinkBtn">复制免登录专属链接（发给 iPad / iPhone）</button>
          <button type="button" class="btn-subtle" id="sbSyncNowBtn">立即双向同步</button>
          <button type="button" class="btn-subtle" id="sbSignOutBtn" style="color:var(--coral);">断开本机</button>
        </div>
      </div>

      <div class="form-group" style="margin-top:16px;padding-top:14px;border-top:1px solid var(--hairline);">
        <label>Apple Watch Ultra 2 快捷指令自动同步</label>
        <p style="font-size:12px;color:var(--ink-tertiary);margin-bottom:10px;">
          与上方共用同一个同步口令，在 iPhone「快捷指令」POST 到下方接口即可自动更新睡眠与跑步记录。
        </p>
        <div class="form-group">
          <label>快捷指令推送接口 URL</label>
          <div style="display:flex;gap:6px;">
            <input type="text" class="form-control" id="aw-endpoint" readonly />
            <button type="button" class="btn-subtle" id="copyAwUrlBtn" style="white-space:nowrap;">复制</button>
          </div>
        </div>
        <div class="form-group">
          <label>你的同步口令 (p_key)</label>
          <div style="display:flex;gap:6px;">
            <input type="text" class="form-control" id="aw-token" readonly />
            <button type="button" class="btn-subtle" id="copyAwTokenBtn" style="white-space:nowrap;">复制</button>
          </div>
        </div>
        <div id="aw-preview-box" style="background:var(--surface-muted);border:1px solid var(--hairline);border-radius:var(--r-md);padding:10px 12px;font-size:11.5px;color:var(--ink-secondary);margin-bottom:10px;line-height:1.6;">
          正在读取云端手表同步记录...
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button type="button" class="btn-obsidian" id="clearDemoHealthBtn">清除示例睡眠与测试数据</button>
          <button type="button" class="btn-subtle" id="testHealthIngestBtn">测试模拟同步</button>
          <label class="btn-subtle" style="cursor:pointer;">
            手动导入健康 JSON
            <input type="file" id="importHealthInput" accept=".json" style="display:none;" />
          </label>
        </div>
      </div>
    </div>
  </div>

  <!-- Generic Mini Modal -->
  <div class="modal-backdrop" id="miniModal">
    <div class="modal" style="max-width:440px;">
      <div class="modal-head">
        <h3 id="miniModalTitle">编辑</h3>
        <button class="icon-btn" onclick="closeModal('miniModal')">✕</button>
      </div>
      <div id="miniModalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="./storage.js?v=20261125c"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./cloud.js?v=20261125c"></script>
  <script src="./ui.js?v=20261125c"></script>
</body>
</html>
